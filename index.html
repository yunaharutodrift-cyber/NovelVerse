
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovelVerse - Light Novel Library</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11111b;color:#f5f1ff;font-family:Arial,sans-serif}
header{padding:20px 6%;background:#1b1929;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Georgia,serif;font-size:26px;color:#c9a9ff;font-weight:bold}
button{border:0;border-radius:8px;padding:11px 16px;background:#9870d8;color:white;cursor:pointer}
.hero{margin:25px auto;padding:35px 25px;max-width:1100px;border-radius:18px;background:linear-gradient(120deg,#38245b,#171725)}
.hero h1{font-family:Georgia,serif;font-size:32px}
.hero p{color:#c9c2d7}
main{max-width:1100px;margin:auto;padding:0 20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}
input,select{padding:12px;border-radius:8px;border:1px solid #454054;background:#211f30;color:white;flex:1;min-width:150px}
h2{font-family:Georgia,serif;color:#d7c2ff}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:20px}
.book{background:#201e2d;padding:12px;border-radius:12px;transition:.2s}
.book:hover{transform:translateY(-4px)}
.cover{height:220px;border-radius:7px;display:flex;align-items:end;padding:14px;position:relative;overflow:hidden;background:linear-gradient(145deg,#8b6ab4,#211b36)}
.cover:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#ffffff20;top:-45px;right:-40px}
.cover span{z-index:1;font-family:Georgia,serif;font-size:19px;font-weight:bold;text-shadow:1px 2px 5px #000}
.cover.two{background:linear-gradient(145deg,#557d91,#182d45)}
.cover.three{background:linear-gradient(145deg,#a66c70,#39202d)}
.cover.four{background:linear-gradient(145deg,#c49a55,#49301d)}
.cover.five{background:linear-gradient(145deg,#668b70,#1d392e)}
.cover.six{background:linear-gradient(145deg,#7475ad,#252444)}
.book h3{font-family:Georgia,serif;font-size:16px;margin-bottom:5px}
.book p{font-size:13px;color:#aaa}
.book button{width:100%;margin-top:5px}
#details{display:none;padding:25px;background:#211f30;border-radius:15px;margin:20px 0}
#details p{line-height:1.7;color:#ccc}
footer{text-align:center;padding:35px;color:#888}
</style>
</head>
<body>
<header>
<div class="logo">📖 NovelVerse</div>
<button onclick="toggleTheme()">Change Theme</button>
</header>

<main>
<section class="hero">
<h1>Discover Your Next World.</h1>
<p>Explore stories, discover new adventures and enjoy your reading journey.</p>
</section>

<h2>Explore Novels</h2>
<div class="tools">
<input id="search" placeholder="Search novels..." oninput="render()">
<select id="genre" onchange="render()">
<option value="All">All genres</option>
<option>Romance</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Drama</option>
</select>
</div>

<div id="details">
<button onclick="closeDetails()">← Back to library</button>
<h2 id="detailTitle"></h2>
<p id="detailAuthor"></p>
<p id="detailDescription"></p>
<button onclick="saveBook()">♡ Add to favourites</button>
</div>

<div class="books" id="books"></div>

<h2>My Favourites</h2>
<div class="books" id="favourites"></div>
</main>

<footer>NovelVerse © 2026 · Your world of stories</footer>

<script>
const novels=[
{title:"The Moonlit Promise",author:"Demo Author",genre:"Romance",cover:"",description:"A gentle romance begins under the light of a mysterious moon."},
{title:"Beyond the Stars",author:"Demo Author",genre:"Fantasy",cover:"two",description:"A young traveller discovers a world beyond the stars."},
{title:"The Last Summer",author:"Demo Author",genre:"Drama",cover:"three",description:"A summer filled with memories, friendship and unexpected discoveries."},
{title:"Kingdom of Ash",author:"Demo Author",genre:"Adventure",cover:"four",description:"An adventure through an ancient kingdom full of secrets."},
{title:"Whispers of Spring",author:"Demo Author",genre:"Romance",cover:"five",description:"A new friendship slowly grows into something special."},
{title:"The Forgotten World",author:"Demo Author",genre:"Fantasy",cover:"six",description:"A forgotten world awaits someone brave enough to find it."}
];

let favourites=JSON.parse(localStorage.getItem("nv_favourites")||"[]");
let selected=null;

function render(){
const query=document.getElementById("search").value.toLowerCase();
const genre=document.getElementById("genre").value;
const filtered=novels.filter(n=>
n.title.toLowerCase().includes(query)&&
(genre==="All"||n.genre===genre)
);
const container=document.getElementById("books");
container.innerHTML="";
filtered.forEach(n=>{
const card=document.createElement("div");
card.className="book";
card.innerHTML=`
<div class="cover ${n.cover}"><span>${n.title}</span></div>
<h3>${n.title}</h3>
<p>${n.genre} · ${n.author}</p>
<button>View details</button>`;
card.querySelector("button").onclick=()=>showDetails(n);
container.appendChild(card);
});
renderFavourites();
}

function showDetails(n){
selected=n;
document.getElementById("details").style.display="block";
document.getElementById("detailTitle").textContent=n.title;
document.getElementById("detailAuthor").textContent=n.author+" · "+n.genre;
document.getElementById("detailDescription").textContent=n.description;
document.getElementById("details").scrollIntoView({behavior:"smooth"});
}
function closeDetails(){
document.getElementById("details").style.display="none";
}
function saveBook(){
if(!selected)return;
if(!favourites.includes(selected.title)){
favourites.push(selected.title);
}else{
favourites=favourites.filter(x=>x!==selected.title);
}
localStorage.setItem("nv_favourites",JSON.stringify(favourites));
renderFavourites();
}
function renderFavourites(){
const container=document.getElementById("favourites");
container.innerHTML="";
favourites.forEach(title=>{
const n=novels.find(x=>x.title===title);
if(!n)return;
const card=document.createElement("div");
card.className="book";
card.innerHTML=`<h3>${n.title}</h3><p>${n.genre}</p><button>Remove</button>`;
card.querySelector("button").onclick=()=>{
favourites=favourites.filter(x=>x!==title);
localStorage.setItem("nv_favourites",JSON.stringify(favourites));
renderFavourites();
};
container.appendChild(card);
});
}
function toggleTheme(){
document.body.classList.toggle("light");
if(document.body.classList.contains("light")){
document.body.style.background="#eee9f5";
document.body.style.color="#211a2c";
}else{
document.body.style.background="#11111b";
document.body.style.color="#f5f1ff";
}
}
render();
</script>
</body>
</html>
