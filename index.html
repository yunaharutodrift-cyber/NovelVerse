
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101019;color:#f5f2ff;font-family:Georgia,serif}
header{padding:22px;background:#191927;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;color:#c5a6ff;font-weight:bold}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:#9b72e8;color:white}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:15px;background:#191927}
nav button{background:#29283b}
main{padding:22px;max-width:1000px;margin:auto}
h1,h2{color:#d2baff}
.hero{padding:30px 20px;background:linear-gradient(135deg,#30204e,#171725);border-radius:16px;margin-bottom:25px}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
.book{background:#202032;border-radius:12px;padding:12px;cursor:pointer}
.cover{height:175px;border-radius:8px;background:linear-gradient(145deg,#7653a9,#29213c);display:grid;place-items:center;font-size:40px}
.book h3{font-size:16px}
.book p{color:#aaa;font-size:13px}
#reader{display:none;background:#f4eddf;color:#30291f;padding:25px;border-radius:8px;min-height:65vh;line-height:2;font-size:19px}
#reader button{margin:5px}
#pageText{white-space:pre-line}
footer{text-align:center;padding:25px;color:#999}
</style>
</head>
<body>
<header>
<div class="logo">📖 NovelVerse</div>
<button onclick="toggleTheme()">Theme</button>
</header>

<nav>
<button onclick="showHome()">Discover</button>
<button onclick="showSaved()">My Library</button>
<button onclick="showHistory()">History</button>
</nav>

<main>
<section id="home">
<div class="hero">
<h1>Enter the world of stories.</h1>
<p>Your personal light novel reading universe.</p>
</div>
<h2>Featured Novels</h2>
<div class="books" id="books"></div>
</section>

<section id="library" style="display:none">
<h2>My Library</h2>
<div class="books" id="savedBooks"></div>
</section>

<section id="history" style="display:none">
<h2>Reading History</h2>
<div class="books" id="historyBooks"></div>
</section>

<section id="reader">
<button onclick="showHome()">← Back</button>
<h2 id="bookTitle"></h2>
<p id="pageText"></p>
<div style="margin-top:30px">
<button onclick="previousPage()">Previous</button>
<span id="pageNumber"></span>
<button onclick="nextPage()">Next</button>
</div>
</section>
</main>

<footer>NovelVerse © 2026</footer>

<script>
const novels=[
{title:"The Beginning of a New World",author:"Demo Author",pages:[
"Chapter 1\n\nThe morning sunlight entered the quiet room. A new day had begun, and with it, a story waiting to be written.",
"The town was peaceful, but something unusual was about to happen. Nobody knew what the future held."
]},
{title:"A Journey Through the Stars",author:"Demo Author",pages:[
"Chapter 1\n\nBeyond the clouds, beyond the stars, a journey began.",
"Somewhere in the endless universe, a mysterious light appeared."
]},
{title:"The Secret Garden",author:"Demo Author",pages:[
"Chapter 1\n\nBehind the old house stood a garden nobody had visited for years.",
"One afternoon, a curious visitor discovered its hidden entrance."
]}
];

let currentBook=null,page=0;
let saved=JSON.parse(localStorage.getItem("nv_saved")||"[]");
let history=JSON.parse(localStorage.getItem("nv_history")||"[]");

function renderBooks(list,target){
document.getElementById(target).innerHTML="";
list.forEach(title=>{
let b=novels.find(n=>n.title===title);
if(!b)return;
let div=document.createElement("div");
div.className="book";
div.innerHTML=`<div class="cover">📕</div><h3>${b.title}</h3><p>${b.author}</p><button>Read</button> <button>♡</button>`;
div.querySelector("button").onclick=()=>openBook(b);
div.querySelectorAll("button")[1].onclick=()=>toggleSave(b.title);
document.getElementById(target).appendChild(div);
});
}

function show(section){
["home","library","history","reader"].forEach(id=>document.getElementById(id).style.display=id===section?"block":"none");
}
function showHome(){show("home")}
function showSaved(){show("library");renderBooks(saved,"savedBooks")}
function showHistory(){show("history");renderBooks(history,"historyBooks")}
function toggleSave(title){
saved=saved.includes(title)?saved.filter(x=>x!==title):[...saved,title];
localStorage.setItem("nv_saved",JSON.stringify(saved));
alert("Library updated!");
}
function openBook(book){
currentBook=book;page=0;
history=[book.title,...history.filter(x=>x!==book.title)];
localStorage.setItem("nv_history",JSON.stringify(history));
show("reader");renderPage();
}
function renderPage(){
document.getElementById("bookTitle").textContent=currentBook.title;
document.getElementById("pageText").textContent=currentBook.pages[page];
document.getElementById("pageNumber").textContent=(page+1)+" / "+currentBook.pages.length;
}
function nextPage(){if(page<currentBook.pages.length-1){page++;renderPage()}}
function previousPage(){if(page>0){page--;renderPage()}}
function toggleTheme(){
document.body.style.background=document.body.style.background==="white"?"#101019":"white";
document.body.style.color=document.body.style.color==="black"?"#f5f2ff":"black";
}
renderBooks(novels.map(n=>n.title),"books");
</script>
</body>
</html>
